[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamfix"
version = "2.0.0"
description = "Get valid JSON out of LLM responses, including while they stream: reasoning/fence-aware extraction, live streaming repair, schema contracts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "rozetyp" }]
keywords = ["llm", "json", "repair", "streaming", "openai", "structured-output"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "json-repair>=0.64",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
server = ["fastapi>=0.100", "uvicorn>=0.23", "httpx>=0.25"]
dev = ["pytest>=7", "streamfix[server]"]

[project.scripts]
streamfix = "streamfix.cli:main"

[project.urls]
Homepage = "https://streamfix.dev"
Repository = "https://github.com/rozetyp/streamfix"

[tool.hatch.build.targets.wheel]
packages = ["src/streamfix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
